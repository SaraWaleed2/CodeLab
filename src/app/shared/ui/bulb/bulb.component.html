<button
  type="button"
  class="bulb"
  [class.on]="on()"
  [class.lg]="size() === 'lg'"
  [class.hint]="hint()"
  [attr.aria-pressed]="on()"
  [attr.aria-label]="label() || value()"
  (click)="toggled.emit()"
>
  @if (on()) {
    <span class="ray" aria-hidden="true"></span>
  }
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path class="glass" d="M12 2.5a6.5 6.5 0 0 0-3.9 11.7c.6.5 1 1.2 1 2V17h5.8v-.8c0-.8.4-1.5 1-2A6.5 6.5 0 0 0 12 2.5z" />
    <path class="glass" d="M9.5 20h5M10.5 22.5h3" />
  </svg>
  <span class="bit">{{ on() ? 1 : 0 }}</span>
  <span class="val">{{ value() }}</span>
</button>

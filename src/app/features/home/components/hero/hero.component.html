<section class="hero">
  <div class="hero-bg" aria-hidden="true">
    <div class="dots"></div>
    <div class="blob green"></div>
    <div class="blob low"></div>
    <div class="digits">
      <span>0</span><span>1</span><span>1</span><span>0</span><span>1</span><span>0</span><span>0</span><span>1</span><span>1</span><span>0</span>
    </div>
  </div>

  <div class="mx-auto grid max-w-[1200px] items-center gap-12 px-6 lg:grid-cols-[1.1fr_1fr]">
    <div>
      <p class="font-semibold text-primary">{{ 'home.kicker' | translate }}</p>
      <h1 class="my-4 text-[clamp(34px,5vw,58px)] font-bold leading-[1.2]" [attr.aria-label]="'home.title' | translate">
        @for (word of words(); track $index; let last = $last) {
          <span class="word" aria-hidden="true" [class.text-primary]="last" [style.animation-delay.ms]="100 + $index * 140">{{ word }}</span>
        }
      </h1>
      <p class="mb-7 max-w-[560px] text-lg text-muted">{{ 'home.lead' | translate }}</p>
      <div class="flex flex-wrap gap-3">
        <a [routerLink]="continueLink()" [fragment]="continueFragment()" class="btn-shine inline-flex min-h-[50px] items-center gap-2 rounded-[14px] bg-primary px-[22px] font-semibold text-on-primary no-underline shadow-glow transition hover:-translate-y-0.5 active:scale-[.97]">
          {{ 'home.continue' | translate: { unit: unitId() } }}
          <svg class="flip-rtl" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
        <a routerLink="/" fragment="map" class="inline-flex min-h-[50px] items-center rounded-[14px] border border-line bg-card px-[22px] font-semibold text-ink no-underline transition hover:-translate-y-0.5 hover:bg-surface active:scale-[.97]">
          {{ 'home.seeMap' | translate }}
        </a>
      </div>
    </div>

    <app-try-card />
  </div>
</section>

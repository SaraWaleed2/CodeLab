[build]
  command = "npm run build"
  publish = "dist/codelab/browser"

[build.environment]
  NODE_VERSION = "24"

# Angular is a single-page app: every path must serve index.html so deep links
# like /units/12/lessons/12-3 and a refresh keep working.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
